name: TraceGuard CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Tests & Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dependency conflict audit
        run: pip check

      - name: Execute pytest test suite
        env:
          TRACEGUARD_ENV: testing
          MODEL_PROVIDER: mock
          MODEL_NAME: deterministic-mock-v1
          LOG_LEVEL: WARNING
        run: |
          pytest -v --tb=short

  frontend-checks:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Execute vitest component tests
        run: npm run test

      - name: Compile TypeScript and build production bundle
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

  integration-smoke:
    name: End-to-End API Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Launch backend server in background
        env:
          TRACEGUARD_ENV: testing
          DATABASE_PATH: ./ci_smoke.db
          API_HOST: 127.0.0.1
          API_PORT: 8000
          MODEL_PROVIDER: mock
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          # Wait for server to become responsive
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status":"healthy"'; then
              echo "TraceGuard backend is healthy and ready!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done

      - name: Verify Health and Benchmark APIs
        run: |
          curl -f http://127.0.0.1:8000/health
          curl -f http://127.0.0.1:8000/benchmarks/tasks
          curl -f http://127.0.0.1:8000/experiments/overview/stats
