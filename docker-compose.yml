services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traceguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TRACEGUARD_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_PATH=/app/data/traceguard.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - LOG_LEVEL=INFO
      - MODEL_PROVIDER=mock
      - MODEL_NAME=deterministic-mock-v1
    volumes:
      - traceguard_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; res = urllib.request.urlopen('http://localhost:8000/health'); exit(0 if res.getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traceguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - traceguard-net

volumes:
  traceguard_data:
    driver: local

networks:
  traceguard-net:
    driver: bridge
